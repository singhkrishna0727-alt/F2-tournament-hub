<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FFTournament Hub</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><h1>🔥 FFTournament Hub</h1><p>Free Fire Tournament Registration</p></header>
<main>
<section class="card">
<h2>Available Tournaments</h2>
<div id="tournaments"><p>Loading tournaments...</p></div>
</section>
<section class="card">
<h2>Player / Squad Registration</h2>
<form id="registrationForm">
<input id="teamName" placeholder="Squad / Team Name" required>
<input id="captain" placeholder="Captain Name" required>
<input id="uid" placeholder="Free Fire UID" required>
<input id="phone" placeholder="Mobile Number" required>
<select id="tournament" required><option value="">Select Tournament</option></select>
<button type="submit">Register Now</button>
</form>
<p id="message"></p>
</section>
</main>
<footer>© FFTournament Hub</footer>
<script type="module" src="app.js"></script>
</body>
</html>
